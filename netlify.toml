# audityourhome.com (the US site) on Netlify, project "audityourhome".
# One `npm run build` builds both sites: dist-us/ (this one) and dist-ca/ (audityourhome.ca, deployed with
# netlify.ca.toml copied over this file; see CLAUDE.md). Redirect rules (old Canadian addresses → audityourhome.ca,
# visitors from Canada → the Canadian twin page, audityourhouse.com → here, the geo endpoint for the "other site"
# bar) are written to dist-us/_redirects by tools/country/postbuild.mjs.
[build]
  command = "npm run build"
  publish = "dist-us"
  # FORMS=netlify renders the site's forms as Netlify Forms (form detection is on for this site);
  # submissions are emailed to dave@clickshift.ca by the form notification set in the Netlify UI.
  # AYH_SITE lets the build refuse to run against the wrong Netlify site.
  environment = { NODE_VERSION = "22", FORMS = "netlify", AYH_SITE = "us" }
